[project]
name = "shesh-mcp-bundle"
version = "0.1.0"
description = "Shesh Soma: curated third-party MCP servers (filesystem/fetch/git) behind the Guard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = ["fastmcp>=3.4.7,<4", "shesh-audit>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.16"]

[project.scripts]
shesh-mcp-bundle-mcp = "shesh_mcp_bundle.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
# BLE+TRY are errors, not style: blind `except Exception` is where silent
# failures live. See shesh-ecosystem/docs (2026-08-12 silent-failure sweep).
extend-select = ["BLE", "TRY"]
select = ["E","F","W","UP","B","SIM","I"]
ignore = ["E402"]
[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
